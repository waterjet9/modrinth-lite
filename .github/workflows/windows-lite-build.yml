name: Windows Lite build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        run: npm install -g pnpm@12.11.2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use prod environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows installer
        run: pnpm --filter=@modrinth/app run tauri build --config tauri-lite.conf.json --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: launcher-lite-windows
          path: target/release/bundle/nsis/*.exe
